name: Sync GitHub Data

on:
  schedule:
    # 每 2 小时定时同步一次
    - cron: "0 */2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/**"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 抓取 GitHub API 并生成静态缓存数据
        run: node scripts/sync-github.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 提交并推送数据变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/github.json
          if git diff --cached --quiet; then
            echo "GitHub 数据无变化，跳过提交"
          else
            git commit -m "chore: 定时同步 GitHub 静态缓存数据"
            git push
          fi
